<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算数ミステリー・ファイル</title>
<style>
:root{
  --navy:#17202e; --navy2:#202c3f; --navy3:#2b3a52;
  --paper:#f5ecd9; --paper2:#efe2c6; --line:#e2d3b2;
  --ink:#3a2e22; --ink2:#6b5a45;
  --gold:#c9a24a; --gold2:#e6c574;
  --red:#b3261e; --green:#2f7d4f; --blue:#2c5d8f;
  --marker:rgba(255,230,60,.75);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh}
body{
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
  background:var(--navy);
  background-image:radial-gradient(circle at 20% 0%,#24324a 0,transparent 55%),radial-gradient(circle at 100% 100%,#1f2a3c 0,transparent 50%);
  color:var(--ink); font-size:17px; line-height:1.75;
}
rt{font-size:.55em;color:inherit;opacity:.85}
ruby{ruby-align:center}
button{font-family:inherit;cursor:pointer}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho","BIZ UDPMincho",serif}

/* ===== ヘッダー ===== */
header{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 22px;background:linear-gradient(#111926,#17202e);
  border-bottom:2px solid var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.4);
  position:relative;z-index:5;
}
.logo{display:flex;align-items:center;gap:10px;color:var(--gold2)}
.logo h1{margin:0;font-size:1.45rem;letter-spacing:.08em}
.logo small{display:block;font-size:.7rem;color:#9fb0c8;letter-spacing:.2em}
.tabs{display:flex;gap:8px;flex:1;min-width:0}
.tab{
  position:relative;min-height:52px;padding:6px 16px;border-radius:10px 10px 4px 4px;
  border:1px solid #3d4f6c;background:var(--navy3);color:#c9d4e5;font-size:.85rem;text-align:left;flex:1 1 0;min-width:0;
  transition:.2s;line-height:1.3;
}
.tab b{display:block;font-size:.72rem;color:var(--gold);letter-spacing:.1em}
.tab:hover{background:#34476a;transform:translateY(-2px)}
.tab.active{background:var(--paper);color:var(--ink);border-color:var(--gold)}
.tab .badge{
  position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:.65rem;font-weight:bold;
  padding:2px 7px;border-radius:20px;transform:rotate(8deg);box-shadow:0 2px 4px rgba(0,0,0,.4);display:none;
}
.tab.cleared .badge{display:block}
.hintBtn{
  min-height:52px;padding:6px 20px;border-radius:30px;border:2px solid var(--gold);
  background:transparent;color:var(--gold2);font-size:1rem;font-weight:bold;transition:.2s;
}
.hintBtn:hover{background:var(--gold);color:var(--navy)}
.hintBtn span{font-size:.8rem;opacity:.85;margin-left:4px}

/* ===== レイアウト ===== */
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;flex:1;min-height:0}
.pane{overflow-y:auto;border-radius:var(--r);padding-right:4px}
.pane::-webkit-scrollbar{width:8px}.pane::-webkit-scrollbar-thumb{background:#4a5a75;border-radius:8px}
.right{display:flex;flex-direction:column;gap:14px}

.paper{
  background:var(--paper);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px;border-radius:var(--r);padding:18px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 40px rgba(150,110,50,.12);
}
.sec{margin-bottom:14px}
.secTitle{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:1.05rem;color:var(--ink);border-bottom:2px dashed #c8b48a;padding-bottom:4px}
.secTitle .ic{width:28px;height:28px;border-radius:50%;background:var(--navy2);color:var(--gold2);display:grid;place-items:center;font-size:.85rem}

.caseHead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.caseHead h2{margin:0;font-size:1.45rem;line-height:1.4}
.caseHead .no{font-size:.8rem;letter-spacing:.25em;color:var(--red);font-weight:bold}
.unit{font-size:.8rem;background:var(--navy2);color:var(--gold2);padding:3px 10px;border-radius:20px}
.story{background:rgba(255,255,255,.55);border-left:5px solid var(--gold);padding:10px 14px;border-radius:6px;margin-top:10px}
.tip{font-size:.85rem;color:var(--ink2);margin:6px 0 0}

/* 難易度・新しい事件 */
.lvBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 14px;padding:8px 10px;background:var(--navy2);border-radius:10px}
.lvLabel{color:var(--gold2);font-size:.85rem;font-weight:bold;letter-spacing:.1em}
.lvBtns{display:flex;gap:6px;flex:1;min-width:0}
.lvBtn{flex:1 1 0;min-height:48px;border-radius:8px;border:2px solid #3d4f6c;background:var(--navy3);color:#c9d4e5;font-size:.95rem;font-weight:bold;line-height:1.2;padding:4px 6px}
.lvBtn small{display:block;font-size:.7rem;font-weight:normal;color:var(--gold2)}
.lvBtn.on{background:var(--paper);color:var(--ink);border-color:var(--gold)}
.lvBtn.on small{color:#8a5a2b}
.newBtn{min-height:48px;padding:4px 16px;border-radius:24px;border:2px solid var(--gold);background:var(--gold);color:var(--navy);font-size:.95rem;font-weight:bold}
.newBtn:hover,.lvBtn:hover{filter:brightness(1.12)}
.lvMsg{display:none;flex-basis:100%;background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:.9rem;animation:pop .3s}
.lvMsg.show{display:block}
.lvTag{display:inline-block;letter-spacing:.05em;color:#fff;padding:0 8px;border-radius:4px;font-size:.75rem;margin-left:4px}
.lvTag.lv1{background:var(--green)}.lvTag.lv2{background:var(--blue)}.lvTag.lv3{background:var(--red)}
@media (max-width:560px){.newBtn{flex-basis:100%}.lvLabel{display:none}.lvBtn{font-size:.85rem;padding:4px 2px}}

/* 証拠カード */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{
  position:relative;background:#fffaf0;border:1px solid #d9c59c;border-radius:10px;padding:12px 14px 12px;
  box-shadow:2px 3px 0 #d3bf94;transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:4px 7px 12px rgba(80,55,20,.25)}
.card::before{ /* クリップ */
  content:"";position:absolute;top:-9px;left:18px;width:14px;height:26px;border:3px solid #8d9aae;border-radius:8px;border-bottom-color:transparent;
}
.card .tag{display:inline-block;font-size:.75rem;font-weight:bold;color:#fff;background:var(--navy3);padding:1px 9px;border-radius:4px;margin-bottom:4px}
.card.testimony .tag{background:#8a5a2b}
.card.camera .tag{background:#5b3b7a}
.card.wide{grid-column:1/-1}

/* マーカー */
.mk{
  cursor:pointer;padding:0 2px;border-radius:3px;
  background-image:linear-gradient(transparent 45%,var(--marker) 45%);
  background-repeat:no-repeat;background-size:0% 100%;transition:background-size .45s ease;
  border-bottom:2px dotted #b49a62;
}
.mk:hover{background-color:rgba(255,240,150,.3)}
.mk.on{background-size:100% 100%;border-bottom-color:transparent}
.num{font-weight:bold;color:#7a2d16}

.diagram{background:#fffaf0;border:1px solid #d9c59c;border-radius:10px;padding:8px}
.diagram svg{width:100%;height:auto;display:block}

/* ===== 捜査ノート ===== */
.noteGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
textarea{
  width:100%;min-height:150px;resize:vertical;border:1px solid #cdb88c;border-radius:8px;padding:10px;
  font-family:inherit;font-size:1rem;line-height:1.7;color:var(--ink);
  background:#fffdf6;background-image:linear-gradient(transparent 27px,#e8dcc0 28px);background-size:100% 28px;
}
.calc{background:var(--navy2);border-radius:10px;padding:8px}
.calc .disp{background:#cfd9c3;color:#1e2a1a;font-family:"Courier New",monospace;font-size:1.2rem;text-align:right;padding:6px 8px;border-radius:6px;min-height:58px;word-break:break-all;line-height:1.3}
.calc .disp small{display:block;font-size:.75rem;color:#4a5a44;min-height:1em}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.keys button{min-height:42px;border:none;border-radius:7px;background:#3a4b66;color:#fff;font-size:1.1rem;transition:.1s}
.keys button:active{transform:scale(.94)}
.keys .op{background:#56688a;color:var(--gold2)}
.keys .eq{background:var(--gold);color:var(--navy);font-weight:bold}
.keys .cl{background:#7a3a34}
.toMemo{width:100%;margin-top:5px;min-height:36px;border:1px dashed var(--gold);background:transparent;color:var(--gold2);border-radius:7px;font-size:.85rem}

.cmp{margin-top:12px;background:rgba(255,255,255,.6);border:1px solid #d9c59c;border-radius:10px;padding:10px}
.cmpRow{display:grid;grid-template-columns:1.3fr 90px 1.4fr;gap:8px;align-items:center;margin-bottom:6px}
.cmpRow input{min-height:40px;border:1px solid #cdb88c;border-radius:6px;padding:4px 8px;font-size:.95rem;font-family:inherit;background:#fffdf6;width:100%}
.bar{height:22px;background:#eadfc6;border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;transition:width .4s;border-radius:4px}
.cmpInfo{font-size:.85rem;color:var(--ink2);text-align:right;min-height:1.4em}

/* ===== 推理の提出 ===== */
.submit{border:3px double #a88a52}
.q{margin:0 0 6px;font-weight:bold}
.q .qn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-size:.9rem;margin-right:6px}
.choices{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.choice{
  display:flex;gap:10px;align-items:center;text-align:left;min-height:50px;padding:8px 12px;
  border:2px solid #d3bf94;border-radius:10px;background:#fffaf0;color:var(--ink);font-size:1rem;transition:.15s;
}
.choice:hover{border-color:var(--gold);transform:translateX(3px)}
.choice .k{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink2);display:grid;place-items:center;font-weight:bold}
.choice.sel{border-color:var(--navy3);background:#e7eef8;box-shadow:inset 0 0 0 1px var(--navy3)}
.choice.sel .k{background:var(--navy3);color:#fff;border-color:var(--navy3)}
.choice code,.eq{font-family:"Courier New",monospace;font-weight:bold;font-size:1.05em}
.nums{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:14px}
.nf{display:flex;align-items:center;gap:6px;font-size:1.05rem}
.nf input{width:110px;min-height:48px;font-size:1.3rem;text-align:center;border:2px solid #cdb88c;border-radius:8px;background:#fffdf6;font-family:inherit}
.nf input:focus,.cmpRow input:focus,textarea:focus{outline:3px solid var(--gold2)}
.mark{font-weight:bold;font-size:1.2rem;width:1.2em;display:inline-block}
.ok{color:var(--green)} .ng{color:var(--red)}
.submitBtn{
  width:100%;min-height:58px;border:none;border-radius:12px;font-size:1.2rem;font-weight:bold;letter-spacing:.1em;
  background:linear-gradient(#2b3a52,#17202e);color:var(--gold2);box-shadow:0 4px 0 #0c1119;transition:.12s;
}
.submitBtn:hover{filter:brightness(1.15)}
.submitBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1119}
.feedback{margin-top:12px;border-radius:10px;padding:12px 14px;display:none;animation:pop .35s ease}
.feedback.show{display:block}
.feedback.wrong{background:#fff3e0;border:2px solid #e3a65a}
.feedback.info{background:#eef3f9;border:2px solid #9db3cf}
.feedback h4{margin:0 0 6px;font-size:1.05rem}
.feedback ul{margin:4px 0;padding-left:0;list-style:none}
.feedback li{margin:4px 0}
.solvedBox{text-align:center;padding:8px}
.solvedBox .mini{display:inline-block;border:3px solid var(--red);color:var(--red);font-weight:bold;padding:2px 14px;transform:rotate(-6deg);letter-spacing:.15em;margin-bottom:8px}
.ghost{min-height:46px;padding:4px 18px;border-radius:10px;border:2px solid var(--navy3);background:#fff;color:var(--navy3);font-size:.95rem;font-weight:bold;margin:4px}
.ghost:hover{background:var(--navy3);color:#fff}

/* ===== モーダル ===== */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex;animation:fade .25s}
.modal{max-width:720px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal h3{margin:0 0 10px;font-size:1.3rem}
.close{position:absolute;top:10px;right:12px;width:44px;height:44px;border-radius:50%;border:none;background:var(--navy2);color:#fff;font-size:1.3rem}
.hintItem{background:#fffaf0;border:1px solid #d9c59c;border-left:6px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:10px;animation:slide .35s ease}
.hintItem b{color:#8a5a2b}
.hintLock{border:2px dashed #c8b48a;border-radius:8px;padding:10px 14px;color:var(--ink2);margin-bottom:10px;text-align:center}
.hintNext{width:100%;min-height:52px;border:none;border-radius:10px;background:var(--gold);color:var(--navy);font-size:1.05rem;font-weight:bold}
.hintNext:disabled{opacity:.45;cursor:default}

.stampWrap{text-align:center;margin:6px 0 14px;height:150px;position:relative;pointer-events:none}
.close{z-index:3}
.stamp{
  display:inline-block;border:6px double var(--red);color:var(--red);border-radius:12px;padding:8px 26px;
  transform:rotate(-10deg) scale(3);opacity:0;animation:stamp .55s cubic-bezier(.2,1.6,.4,1) .15s forwards;
  background:rgba(255,255,255,.4);
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000 60%,rgba(0,0,0,.75) 61%);
}
.stamp .en{font-size:2.2rem;font-weight:900;letter-spacing:.12em;line-height:1.1;font-family:Impact,"Arial Black",sans-serif}
.stamp .jp{font-size:1.3rem;font-weight:bold;letter-spacing:.3em}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 52px;margin-bottom:8px;background:#fffaf0;border:1px solid #d9c59c;border-radius:8px;opacity:0;animation:slide .4s ease forwards}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--navy3);color:var(--gold2);display:grid;place-items:center;font-weight:bold}
.steps li .st{display:block;font-weight:bold;color:var(--navy3)}
.note{background:#eef3f9;border-radius:8px;padding:10px 14px;margin-top:8px;font-size:.95rem}
.allClear{text-align:center;color:var(--red);font-weight:bold;margin-top:10px;font-size:1.1rem}

@keyframes stamp{0%{opacity:0;transform:rotate(-10deg) scale(3)}70%{opacity:1;transform:rotate(-10deg) scale(.92)}100%{opacity:1;transform:rotate(-10deg) scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s 2}

/* ===== レスポンシブ ===== */
@media (max-width:1100px){ .tabs{order:3;flex-basis:100%} .logo h1{font-size:1.25rem} header{padding:10px 16px;gap:10px;justify-content:space-between} }
@media (max-width:900px){
  body{height:auto;display:block} main{grid-template-columns:1fr}
  .pane{overflow:visible}
  .noteGrid{grid-template-columns:1fr}
}
@media (max-width:560px){ .cards{grid-template-columns:1fr} .cmpRow{grid-template-columns:1fr 80px} .cmpRow .bar{grid-column:1/-1} }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="16" cy="16" r="11" fill="none" stroke="#e6c574" stroke-width="4"/>
      <circle cx="16" cy="16" r="7" fill="rgba(230,197,116,.18)"/>
      <line x1="24" y1="24" x2="36" y2="36" stroke="#e6c574" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div><h1 class="serif">算数ミステリー・ファイル</h1><small>SANSU MYSTERY FILE</small></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <button class="hintBtn" id="hintBtn">🔎 ヒント<span id="hintCount"></span></button>
</header>

<main>
  <!-- 左：事件ファイル -->
  <section class="pane">
    <div class="paper" id="caseFile"></div>
  </section>

  <!-- 右：捜査ノート＆推理の提出 -->
  <section class="pane right">
    <div class="paper">
      <h3 class="secTitle"><span class="ic">✎</span><span>{捜査|そうさ}ノート</span></h3>
      <div class="noteGrid">
        <div>
          <textarea id="memo" placeholder="気づいたことや計算を自由にメモしよう。&#10;（例）1.2km = 1200m"></textarea>
        </div>
        <div class="calc">
          <div class="disp"><small id="calcExpr"></small><span id="calcOut">0</span></div>
          <div class="keys" id="keys"></div>
          <button class="toMemo" id="toMemo">↓ 答えをメモに書く</button>
        </div>
      </div>
      <div class="cmp">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
          <b style="font-size:.95rem">📏 数をならべてくらべる（線分図メモ）</b>
          <button class="ghost" id="cmpClear" style="min-height:36px;padding:2px 12px;font-size:.8rem">けす</button>
        </div>
        <div id="cmpRows"></div>
        <div class="cmpInfo" id="cmpInfo"></div>
      </div>
    </div>

    <div class="paper submit" id="submitArea"></div>
  </section>
</main>

<!-- ヒント -->
<div class="overlay" id="hintOv">
  <div class="paper modal">
    <button class="close" data-close="hintOv" aria-label="とじる">✕</button>
    <h3 class="serif">🔎 探{偵|てい}のヒント手帳</h3>
    <div id="hintBody"></div>
  </div>
</div>

<!-- 正解 -->
<div class="overlay" id="clearOv">
  <div class="paper modal">
    <button class="close" data-close="clearOv" aria-label="とじる">✕</button>
    <div class="stampWrap"><div class="stamp"><div class="en">CASE CLOSED</div><div class="jp">事件解決！</div></div></div>
    <h3 class="serif" id="clearTitle"></h3>
    <ol class="steps" id="clearSteps"></ol>
    <div class="note" id="clearNote"></div>
    <div class="allClear" id="allClear"></div>
    <div style="text-align:center;margin-top:12px" id="clearBtns"></div>
  </div>
</div>

<script>
/* =========================================================
   表記ヘルパー
   {漢字|よみ} → ルビ、 [[文]] → クリックでマーカーが引ける部分
   ========================================================= */
function rb(s){return s.replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');}
function fmt(s,ctr){
  s=rb(s);
  if(!ctr) return s;
  return s.replace(/\[\[(.+?)\]\]/g,function(m,t){return '<span class="mk" data-mk="'+(ctr.i++)+'">'+t+'</span>';});
}
document.querySelectorAll('.secTitle span:last-child, h3.serif, b').forEach(function(el){
  if(el.innerHTML.indexOf('{')>=0) el.innerHTML=rb(el.innerHTML);
});

/* =========================================================
   乱数（seed つき：同じ seed なら同じ問題を作り直せる）
   ========================================================= */
function RNG(seed){
  var a=seed>>>0;
  var f=function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
  return {
    int:function(lo,hi){return lo+Math.floor(f()*(hi-lo+1));},
    pick:function(arr){return arr[Math.floor(f()*arr.length)];},
    shuffle:function(arr){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(f()*(i+1)),t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
  };
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function lcm(a,b){return a/gcd(a,b)*b;}
function near(x,y){return Math.abs(x-y)<0.01;}
function dec(x){return String(Math.round(x*1000)/1000);}
var KANA=['ア','イ','ウ'];
/* 選択肢をまぜて ア・イ・ウ をつける。items:[{id,t,adv}] */
function arrange(R,items,correctId){
  var o={choices:[],adviceChoice:{},L:{}};
  R.shuffle(items).forEach(function(it,i){
    var k=KANA[i];o.choices.push({k:k,t:it.t});o.L[it.id]=k;
    if(it.id!==correctId) o.adviceChoice[k]=it.adv;
  });
  o.correct=o.L[correctId];return o;
}

var KEY='sansuMystery_data';
/* prob：いま出ている問題（難易度と seed）　solved：型ごと・難易度ごとの解決数　lv：型ごとに選んでいる難易度 */
var store={cleared:{},notes:{},marks:{},cmp:{},hint:{},prob:{},solved:{},lv:{}};
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d)for(var k in store)if(d[k])store[k]=d[k];}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
load();
var CASES=[];
function newSeed(){return Math.floor(Math.random()*2147483646)+1;}
/* i 番目の型に、新しい問題を作る（メモ・マーカー・ヒントもリセット） */
function newProblem(i,lv){
  lv=lv||store.lv[i]||2; store.lv[i]=lv;
  store.prob[i]={lv:lv,seed:newSeed()};
  delete store.cleared[i]; delete store.notes[i]; delete store.marks[i]; delete store.cmp[i]; delete store.hint[i];
  CASES[i]=TYPES[i](lv,RNG(store.prob[i].seed)); save();
}
function solvedOf(i){return store.solved[i]||[0,0,0];}
function solvedSum(i){return solvedOf(i).reduce(function(a,b){return a+b;},0);}
TYPES.forEach(function(g,i){
  var pr=store.prob[i];
  if(pr&&pr.seed){CASES[i]=g(pr.lv,RNG(pr.seed));}
  else{newProblem(i,store.lv[i]||2);}   // 前の版（決まった3問）の記録は、新しい問題に入れかえる
});

var KEYS=['C','←','(',')','7','8','9','÷','4','5','6','×','1','2','3','－','0','.','＝','＋'];
$('keys').innerHTML=KEYS.map(function(k){
  var c=/[÷×－＋()]/.test(k)?'op':k==='＝'?'eq':(k==='C'||k==='←')?'cl':'';
  return '<button class="'+c+'" data-k="'+k+'">'+k+'</button>';
}).join('');
function calcEval(s){
  var t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/－/g,'-').replace(/＋/g,'+');
  var toks=t.match(/\d+\.?\d*|\.\d+|[+\-*/()]/g)||[],p=0;
  function peek(){return toks[p];}
  function E(){var v=T();while(peek()==='+'||peek()==='-'){var o=toks[p++],r=T();v=o==='+'?v+r:v-r;}return v;}
  function T(){var v=F();while(peek()==='*'||peek()==='/'){var o=toks[p++],r=F();v=o==='*'?v*r:v/r;}return v;}
  function F(){var k=toks[p++];if(k==='-')return -F();if(k==='('){var v=E();if(toks[p++]!==')')throw 0;return v;}var n=parseFloat(k);if(isNaN(n))throw 0;return n;}
  var v=E(); if(p!==toks.length||!isFinite(v)) throw 0;
  return Math.round(v*1e8)/1e8;
}
var lastAns='';
$('keys').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; var k=b.dataset.k;
  if(k==='C'){expr='';$('calcExpr').textContent='';$('calcOut').textContent='0';return;}
  if(k==='←'){expr=expr.slice(0,-1);}
  else if(k==='＝'){
    try{var v=calcEval(expr);$('calcExpr').textContent=expr+' ＝';$('calcOut').textContent=v;lastAns=expr+' ＝ '+v;expr=String(v);}
    catch(err){$('calcExpr').textContent='式をたしかめてね';}
    return;
  } else expr+=k;
  $('calcOut').textContent=expr||'0';
});
$('toMemo').addEventListener('click',function(){
  if(!lastAns) return;
  var m=$('memo'); m.value+=(m.value&&!/\n$/.test(m.value)?'\n':'')+lastAns+'\n';
  store.notes[cur]=m.value; save();
});

/* =========================================================
   線分図メモ（数をならべてくらべる）
   ========================================================= */
var COLORS=['#2c5d8f','#b3261e','#c9a24a'];
function renderCmp(){
  var c=CASES[cur],d=store.cmp[cur]||[['',''],['',''],['','']];
  $('cmpRows').innerHTML=d.map(function(r,i){
    var ph=c.cmp[i]?c.cmp[i].replace(/\{([^|]+)\|[^}]+\}/g,'$1'):'名前（自由に）';
    return '<div class="cmpRow"><input data-r="'+i+'" data-c="0" placeholder="'+ph+'" value="'+esc(r[0])+'">'+
      '<input data-r="'+i+'" data-c="1" inputmode="decimal" placeholder="数" value="'+esc(r[1])+'">'+
      '<div class="bar"><i style="background:'+COLORS[i]+'"></i></div></div>';
  }).join('');
  drawBars();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function toNum(s){
  s=String(s).replace(/[０-９．]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);}).replace(/[－ー−]/g,'-').replace(/\s/g,'');
  if(s===''||!/^-?\d*\.?\d+$/.test(s)) return null;
  return parseFloat(s);
}
function drawBars(){
  var d=store.cmp[cur]||[['',''],['',''],['','']];
  var vals=d.map(function(r){return toNum(r[1]);});
  var mx=Math.max.apply(null,vals.map(function(v){return v&&v>0?v:0;}));
  var bars=document.querySelectorAll('#cmpRows .bar i');
  vals.forEach(function(v,i){bars[i].style.width=(mx>0&&v>0?v/mx*100:0)+'%';});
  var f=vals.filter(function(v){return v!==null;});
  var info='';
  if(f.length===2&&vals[0]!==null&&vals[1]!==null) info='上の2つの差：'+(Math.round(Math.abs(vals[0]-vals[1])*1e6)/1e6);
  else if(f.length>=2) info='合計：'+(Math.round(f.reduce(function(a,b){return a+b;},0)*1e6)/1e6);
  $('cmpInfo').textContent=info;
}
$('cmpRows').addEventListener('input',function(e){
  var t=e.target; if(!t.dataset.r) return;
  var d=store.cmp[cur]||[['',''],['',''],['','']];
  d[+t.dataset.r][+t.dataset.c]=t.value; store.cmp[cur]=d; save(); drawBars();
});
$('cmpClear').addEventListener('click',function(){delete store.cmp[cur];save();renderCmp();});

/* =========================================================
   推理の提出
   ========================================================= */
function renderSubmit(){
  var c=CASES[cur];
  var html='<h3 class="secTitle"><span class="ic">⚖</span><span>'+rb('{推理|すいり}の提出')+'</span></h3>';
  if(store.cleared[cur]){
    html+='<div class="solvedBox"><div class="mini">CASE CLOSED</div><p style="margin:4px 0 8px">この事件は解決ずみだ。みごとな{推理|すいり}だった！</p>'+
      '<button class="ghost" id="newHere">🎲 新しい事件にちょうせん</button><button class="ghost" id="reExplain">解説をもう一度見る</button><button class="ghost" id="retry">もう一度ときなおす</button></div>';
    $('submitArea').innerHTML=rb(html);
    $('newHere').onclick=function(){goNew();};
    $('reExplain').onclick=function(){showClear(false);};
    $('retry').onclick=function(){delete store.cleared[cur];save();sel=null;renderSubmit();};
    return;
  }
  html+='<p class="q"><span class="qn">1</span>'+rb(c.choiceQ)+'</p><div class="choices">'+
    c.choices.map(function(ch){return '<button class="choice" data-k="'+ch.k+'"><span class="k">'+ch.k+'</span><span>'+rb(ch.t)+'</span><span class="mark" data-m="c'+ch.k+'"></span></button>';}).join('')+
    '</div><p class="q"><span class="qn">2</span>'+rb(c.numQ)+'</p><div class="nums">'+
    c.fields.map(function(f,i){return '<label class="nf">'+f.pre+' <input data-f="'+i+'" inputmode="decimal" autocomplete="off"> '+f.unit+' <span class="mark" data-m="n'+i+'"></span></label>';}).join('')+
    '</div><button class="submitBtn" id="submitBtn">🔍 '+rb('{推理|すいり}を提出する')+'</button><div class="feedback" id="fb"></div>';
  $('submitArea').innerHTML=html;
  document.querySelectorAll('.choice').forEach(function(b){
    b.onclick=function(){sel=b.dataset.k;document.querySelectorAll('.choice').forEach(function(x){x.classList.toggle('sel',x===b);});};
  });
  $('submitBtn').onclick=judge;
}
function judge(){
  var c=CASES[cur],fb=$('fb');
  var inputs=[].slice.call(document.querySelectorAll('.nf input'));
  var vals=inputs.map(function(i){return toNum(i.value);});
  document.querySelectorAll('.mark').forEach(function(m){m.textContent='';m.className='mark';});
  if(!sel||vals.some(function(v){return v===null;})){
    fb.className='feedback info show';
    fb.innerHTML=rb('<h4>📝 まだ空いているところがあるよ</h4>'+(!sel?'<div>・① の答えをア〜ウから1つえらぼう。</div>':'')+(vals.some(function(v){return v===null;})?'<div>・② の数を半角または全角の数字で書こう。</div>':''));
    return;
  }
  var okC=sel===c.correct;
  var okN=c.fields.map(function(f,i){return Math.abs(vals[i]-f.ans)<1e-9;});
  var allN=okN.every(Boolean);
  // ○×の表示
  var mc=document.querySelector('[data-m="c'+sel+'"]'); mc.textContent=okC?'○':'×'; mc.classList.add(okC?'ok':'ng');
  okN.forEach(function(o,i){var m=document.querySelector('[data-m="n'+i+'"]');m.textContent=o?'○':'×';m.classList.add(o?'ok':'ng');});
  if(okC&&allN){
    fb.className='feedback';
    if(!store.cleared[cur]){var sv=solvedOf(cur).slice();sv[CASES[cur].lv-1]++;store.solved[cur]=sv;}
    store.cleared[cur]=true; save(); renderTabs(); renderLvBar();
    showClear(true); renderSubmit(); return;
  }
  var tips=[];
  if(!okC) tips.push('<li><span class="mark ng">×</span> <b>① 根{拠|きょ}</b>：'+(c.adviceChoice[sel]||'')+'</li>');
  else tips.push('<li><span class="mark ok">○</span> <b>① 根{拠|きょ}</b>：正しく見ぬけているね！</li>');
  if(!allN) tips.push('<li><span class="mark ng">×</span> <b>② 数</b>：'+c.adviceNum(vals)+'</li>');
  else tips.push('<li><span class="mark ok">○</span> <b>② 数</b>：計算はばっちりだ！</li>');
  fb.className='feedback wrong show';
  fb.innerHTML=rb('<h4>🤔 {推理|すいり}に{矛盾|むじゅん}があるようだ…</h4><div style="font-size:.9rem;color:#6b5a45">でも、あと一歩！ この証{拠|こ}を見直してみよう。</div><ul>'+tips.join('')+'</ul><div style="font-size:.85rem;color:#6b5a45">こまったら、上の「🔎 ヒント」も使ってみよう。</div>');
  fb.classList.remove('shake'); void fb.offsetWidth; fb.classList.add('shake');
}

/* 正解の演出と解説 */
function showClear(anim){
  var c=CASES[cur];
  $('clearTitle').innerHTML='事件'+c.no+'「'+rb(c.title)+'」（'+LV_NAME[c.lv]+'）の解き方';
  $('clearSteps').innerHTML=c.explain.map(function(s,i){return '<li style="animation-delay:'+(0.6+i*0.25)+'s"><span class="st">'+rb(s[0])+'</span>'+rb(s[1])+'</li>';}).join('');
  $('clearNote').innerHTML=rb(c.note);
  var total=CASES.reduce(function(a,_,i){return a+solvedSum(i);},0);
  var allType=CASES.every(function(_,i){return solvedSum(i)>0;});
  $('allClear').innerHTML=rb('🏅 これまでに解決した事件：<b>'+total+'件</b>'+(allType?'<br>3つの型をすべて解決！ きみは名{探|たん}{偵|てい}だ！':''));
  var nx=(cur+1)%CASES.length;
  $('clearBtns').innerHTML='<button class="ghost" id="goSame">🎲 同じ型の新しい事件へ</button><button class="ghost" id="goNext">事件'+CASES[nx].no+'へ ▶</button><button class="ghost" data-close="clearOv">とじる</button>';
  $('goSame').onclick=function(){closeOv('clearOv');goNew();};
  $('goNext').onclick=function(){closeOv('clearOv');cur=nx;sel=null;renderTabs();renderCase();document.querySelectorAll('.pane').forEach(function(p){p.scrollTop=0;});};
  var st=document.querySelector('.stamp'); st.style.animation='none'; void st.offsetWidth; st.style.animation='';
  if(!anim){st.style.animation='none';st.style.opacity=1;st.style.transform='rotate(-10deg)';}else{st.style.opacity='';st.style.transform='';}
  openOv('clearOv');
}

/* =========================================================
   段階的ヒント
   ========================================================= */
var HINT_NAMES=['ヒント1（着眼点）','ヒント2（とちゅうの式）','ヒント3（考え方の{核|かく}心）'];
function updateHintCount(){var n=store.hint[cur]||0;$('hintCount').textContent=n?'（'+n+'/3）':'';}
function renderHint(){
  var c=CASES[cur],n=store.hint[cur]||0,h='';
  h+='<p style="margin:0 0 10px;color:#6b5a45;font-size:.9rem">事件'+c.no+'「'+rb(c.title)+'」（'+LV_NAME[c.lv]+'）　ボタンをおすたびに、ヒントが1つずつ出てくるよ。</p>';
  for(var i=0;i<3;i++){
    if(i<n) h+='<div class="hintItem"><b>'+rb(HINT_NAMES[i])+'</b><br>'+rb(c.hints[i])+'</div>';
    else h+='<div class="hintLock">🔒 '+rb(HINT_NAMES[i])+'</div>';
  }
  h+='<button class="hintNext" id="hintNext"'+(n>=3?' disabled':'')+'>'+(n>=3?'ヒントはここまで。あとはきみの{推理|すいり}だ！':'次のヒントを見る（'+(n+1)+'/3）')+'</button>';
  $('hintBody').innerHTML=rb(h);
  var b=$('hintNext'); if(b) b.onclick=function(){store.hint[cur]=Math.min(3,(store.hint[cur]||0)+1);save();renderHint();updateHintCount();};
}
$('hintBtn').onclick=function(){renderHint();openOv('hintOv');};

/* モーダル共通 */
function openOv(id){$(id).classList.add('show');}
function closeOv(id){$(id).classList.remove('show');}
document.addEventListener('click',function(e){
  var c=e.target.closest('[data-close]'); if(c){closeOv(c.dataset.close);return;}
  if(e.target.classList.contains('overlay')) e.target.classList.remove('show');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.overlay.show').forEach(function(o){o.classList.remove('show');});});

/* 開始 */
renderTabs(); renderCase();
</script>
